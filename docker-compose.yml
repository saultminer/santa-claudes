services:
  init-tasks:
      build:
        context: .
        args:
          USER_ID: ${USER_ID}
          GROUP_ID: ${GROUP_ID}
        dockerfile: Dockerfile
      user: root
      command: chown -R ${USER_ID}:${GROUP_ID} /certs /var/lib/docker /run/user/${USER_ID} /home/rootless/.local/share/docker
      volumes:
        - dind-certs:/certs
        - dind-storage:/var/lib/docker
        - dind-runtime:/run/user/${USER_ID}
        - dind-data:/home/rootless/.local/share/docker
  dind:
    image: docker:29.8.1-dind-rootless
    user: "${USER_ID}:${GROUP_ID}"
    privileged: true
    cgroup: host
    environment:
      HOME: "/home/rootless"
      XDG_RUNTIME_DIR: "/run/user/${USER_ID}"
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_DRIVER: fuse-overlayfs
      DOCKER_TLS_SAN: "DNS:dind,IP:127.0.0.1"
      DOCKER_DAEMON_ARGS: "--exec-opt native.cgroupdriver=cgroupfs --storage-opt fuse-overlayfs.override_chown=true"
    networks:
      - dind-network
    ports:
      - "127.0.0.1:80:10080" # standard web
      - "127.0.0.1:81:10081"
      - "127.0.0.1:1080:11080" # smtp
      - "127.0.0.1:3001:13001"
      - "127.0.0.1:3306:13306" # mysql
      - "127.0.0.1:9090:19090" # prometheus
      - "127.0.0.1:9229:19229"
    volumes:
      - ${WORKSHOP_DIR}:/home/rootless/workshop
      - dind-certs:/certs
      - dind-storage:/var/lib/docker
      - dind-runtime:/run/user/${USER_ID}
      - dind-data:/home/rootless/.local/share/docker
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      init-tasks:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://127.0.0.1:2376 info > /dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
  workshop:
    build:
      context: .
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
      dockerfile: Dockerfile
    # Share dind's network namespace so dind's loopback is our loopback.
    network_mode: "service:dind"
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - ${WORKSHOP_DIR}:/home/rootless/workshop
      - ./docker-compose.yml:/home/rootless/docker-compose.yml
      - dind-certs:/certs:ro
    working_dir: /home/rootless/workshop
    depends_on:
      dind:
        condition: service_healthy
networks:
  dind-network:
    driver: bridge
volumes:
  dind-certs:
  dind-storage:
  dind-runtime:
  dind-data: